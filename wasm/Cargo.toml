[package]
name = "benchmate-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebAssembly bindings (plain C ABI, no wasm-bindgen) for benchmate-core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
benchmate-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
