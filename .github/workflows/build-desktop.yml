name: Build desktop app

# Reusable workflow: builds the desktop installers for every platform and
# uploads them as workflow artifacts named release-<platform>.
# Called by release.yml (for a draft release) and by ci.yml when CI is run by
# hand with "Build desktop installers" ticked (to test a build, no release).

on:
  workflow_call:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (used in file names)"
        required: true
        type: string
      macos_intel:
        description: "Also build macOS Intel (x86_64)"
        required: false
        type: boolean
        default: false
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"
  # Python reads the data files as UTF-8 on Windows too (default there is cp1252).
  PYTHONUTF8: "1"

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          INTEL: ${{ inputs.macos_intel }}
        run: |
          M='[
            {"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"msi,nsis"},
            {"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"},
            {"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"}'
          if [ "$INTEL" = "true" ]; then
            M="$M"',{"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}'
          fi
          echo "matrix=$(echo "$M]" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ inputs.version }}
      # SignPath (Windows code signing) is optional: the signing steps only run
      # when this secret exists. See docs/release.md.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Build WebAssembly and data into app/
        run: bash scripts/build-web.sh

      - name: Build desktop app (tauri build)
        working-directory: desktop
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Collect installers (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          B="desktop/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          for f in "$B"/msi/*.msi;           do [ -e "$f" ] && cp "$f" "dist/Machinists-BenchMate_${VERSION}_windows_x64.msi"; done
          for f in "$B"/nsis/*-setup.exe;    do [ -e "$f" ] && cp "$f" "dist/Machinists-BenchMate_${VERSION}_windows_x64-setup.exe"; done
          for f in "$B"/appimage/*.AppImage; do [ -e "$f" ] && cp "$f" "dist/Machinists-BenchMate_${VERSION}_linux_x86_64.AppImage"; done
          for f in "$B"/deb/*.deb;           do [ -e "$f" ] && cp "$f" "dist/machinists-benchmate_${VERSION}_amd64.deb"; done
          ls -l dist
          [ -n "$(ls -A dist)" ] || { echo "::error::No installers were produced"; exit 1; }

      - name: Ad hoc sign, verify and zip the macOS app
        if: runner.os == 'macOS'
        run: |
          ARCH=$([ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && echo apple-silicon || echo intel)
          B="desktop/target/${{ matrix.target }}/release/bundle"
          APP="$(ls -d "$B"/macos/*.app | head -n1)"
          echo "App bundle: $APP"
          # Ad hoc signature (no Apple Developer ID): free, but Gatekeeper still
          # asks the user to allow the app once (System Settings > Open Anyway).
          # Same options as the Tauri bundler's own signature (hardened runtime
          # plus desktop/Entitlements.plist), so the microphone entitlement for
          # the chatter finder survives the re-sign.
          codesign --force --deep --options runtime --entitlements desktop/Entitlements.plist --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier|Format|flags'
          codesign -d --entitlements - "$APP" 2>&1 | grep -q 'com.apple.security.device.audio-input' || { echo "::error::audio-input entitlement missing"; exit 1; }
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist" || { echo "::error::NSMicrophoneUsageDescription missing from Info.plist"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Machinists-BenchMate_${VERSION}_macos_${ARCH}.app.zip"
          DMG="$(ls "$B"/dmg/*.dmg | head -n1)"
          # The app inside the disk image must be signed too.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MNT"/*.app
          codesign -d --entitlements - "$MNT"/*.app 2>&1 | grep -q 'com.apple.security.device.audio-input' || { hdiutil detach "$MNT"; echo "::error::audio-input entitlement missing in the DMG app"; exit 1; }
          hdiutil detach "$MNT"
          cp "$DMG" "dist/Machinists-BenchMate_${VERSION}_macos_${ARCH}.dmg"
          ls -l dist

      - name: Upload unsigned Windows installers for SignPath
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Sign Windows installers with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Use the signed Windows installers
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        run: |
          ls -l dist-signed
          cp -f dist-signed/* dist/
          echo "Windows installers are signed by SignPath."

      - name: Note unsigned Windows build
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN == ''
        run: echo "::notice::SIGNPATH_API_TOKEN is not set, so the Windows installers are unsigned (SmartScreen will warn). See docs/release.md."

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
