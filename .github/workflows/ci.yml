name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_bundles:
        description: "Also build the desktop installers for every platform (test build, no release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-and-web:
    name: Core tests, WebAssembly build, UI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match
        run: python3 scripts/check-versions.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: Build WebAssembly and data (scripts/build-web.sh)
        run: bash scripts/build-web.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Install Playwright (Chromium)
        working-directory: tests/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test app/ (every tool, inch and mm, desktop CSP, no console errors)
        run: node tests/smoke/smoke.mjs

  desktop:
    name: Desktop crate (Tauri) check and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo clippy (desktop)
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (desktop)
        working-directory: desktop
        run: cargo test --locked

  bundles:
    name: Desktop installers (test build)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_bundles
    needs: [core-and-web, desktop]
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ci-${{ github.run_number }}
      macos_intel: false
